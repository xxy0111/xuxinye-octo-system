<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据库连接测试 | 徐欣烨</title>
  <link rel="stylesheet" href="./css/xuxinye_common.css">
</head>
<body>
  <div class="xuxinye_shell">
    <header class="xuxinye_topbar">
      <a class="xuxinye_topbar__brand" href="./index.html">徐欣烨 <span>·</span> 科技资讯站</a>
      <nav class="xuxinye_topbar__nav">
        <a class="xuxinye_topbar__link" href="./index.html">首页</a>
        <a class="xuxinye_topbar__link" href="./news.html">科技新闻</a>
        <a class="xuxinye_topbar__link" href="./gallery.html">科技图文</a>
        <a class="xuxinye_topbar__link" href="./chat.html">AI 对话</a>
        <a class="xuxinye_topbar__link" href="./kb.html">RAG 知识库</a>
        <a class="xuxinye_topbar__link xuxinye_topbar__link--active" href="./database.html">数据库连接</a>
      </nav>
    </header>

    <main class="xuxinye_main">
      <section class="xuxinye_pageHead">
        <h1 class="xuxinye_pageHead__title">数据库连接测试</h1>
        <p class="xuxinye_pageHead__desc">
          输入 MySQL 用户名与密码，点击按钮由后端尝试建立连接并返回结果。
        </p>
      </section>

      <section class="xuxinye_apiBox">
        <div class="xuxinye_apiBox__head">
          <span class="xuxinye_apiBox__method">POST</span>
          <span class="xuxinye_apiBox__url">http://localhost:8111/api/db/test</span>
          <span>请求体：{ "xuxinye_user": "root", "xuxinye_password": "******" }</span>
        </div>
        <pre class="xuxinye_apiBox__json" id="xuxinye_apiData">尚未发起请求</pre>
      </section>

      <form class="xuxinye_form" id="xuxinye_dbForm">
        <div class="xuxinye_form__group">
          <label class="xuxinye_label" for="xuxinye_user">数据库用户名</label>
          <input class="xuxinye_input" type="text" id="xuxinye_user" value="root" autocomplete="off">
        </div>
        <div class="xuxinye_form__group">
          <label class="xuxinye_label" for="xuxinye_password">数据库密码</label>
          <input class="xuxinye_input" type="password" id="xuxinye_password" value="root" autocomplete="off">
        </div>
        <button class="xuxinye_btn" type="submit" id="xuxinye_submit">连接数据库</button>
      </form>

      <div class="xuxinye_result" id="xuxinye_result"></div>
      <p class="xuxinye_tip">
        提示：用户名与密码仅用于本次连接测试，接口不会写入数据库；本机实际密码请以 backend/.env 为准。
      </p>
    </main>

    <footer class="xuxinye_footer">
      徐欣烨 · 22001010111 · 高级网页设计课程作业 · 2026
    </footer>
  </div>

  <script src="./js/xuxinye_common.js"></script>
  <script src="./js/xuxinye_database.js"></script>
</body>
</html>
